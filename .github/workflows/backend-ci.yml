name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install locked development dependencies
        run: python -m pip install -r backend/requirements-lock.txt

      - name: Set up Node for frontend syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend module syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/views.js
          node --check frontend/js/app.js
          node frontend/tests/security-smoke.mjs

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Lint
        run: ruff check backend scripts

      - name: Check formatting
        run: ruff format --check backend scripts

      - name: Apply migration baseline
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Run tests
        run: python -m pytest -q

  browser-accessibility:
    name: Accessibility smoke (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install locked development dependencies
        run: python -m pip install -r backend/requirements-lock.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser-test dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit browser-test dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Install ${{ matrix.browser }} and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Remove stale local axe report
        run: rm -f "reports/accessibility/${{ matrix.browser }}-axe.json"

      - name: Run browser accessibility smoke
        run: npm --prefix frontend run test:a11y
        env:
          A11Y_BROWSER: ${{ matrix.browser }}
          A11Y_PORT: "8767"
          A11Y_REPORT_PATH: ${{ github.workspace }}/reports/accessibility/${{ matrix.browser }}-axe.json

      - name: Upload axe accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clarity-browser-accessibility-${{ matrix.browser }}-${{ github.run_id }}
          path: reports/accessibility/${{ matrix.browser }}-axe.json
          if-no-files-found: warn
          retention-days: 30

  container-build:
    name: Compose build, image CVE scan, runtime, and restore smoke
    runs-on: ubuntu-latest
    env:
      SITE_ADDRESS: localhost
      APP_IMAGE_TAG: ci
      APP_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      POSTGRES_DB: clarity_checker
      POSTGRES_ADMIN_USER: clarity_admin
      POSTGRES_ADMIN_PASSWORD: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_DB_USER: clarity_app
      APP_DB_PASSWORD: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      MAIL_HOST: smtp.example.test
      MAIL_PORT: "587"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_FROM: notifications@example.test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose config --quiet

      - name: Write ephemeral test environment
        run: |
          {
            printf 'SITE_ADDRESS=%s\n' "$SITE_ADDRESS"
            printf 'APP_IMAGE_TAG=%s\n' "$APP_IMAGE_TAG"
            printf 'APP_SECRET_KEY=%s\n' "$APP_SECRET_KEY"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_ADMIN_USER=%s\n' "$POSTGRES_ADMIN_USER"
            printf 'POSTGRES_ADMIN_PASSWORD=%s\n' "$POSTGRES_ADMIN_PASSWORD"
            printf 'APP_DB_USER=%s\n' "$APP_DB_USER"
            printf 'APP_DB_PASSWORD=%s\n' "$APP_DB_PASSWORD"
            printf 'MAIL_HOST=%s\n' "$MAIL_HOST"
            printf 'MAIL_PORT=%s\n' "$MAIL_PORT"
            printf 'MAIL_USERNAME=%s\n' "$MAIL_USERNAME"
            printf 'MAIL_PASSWORD=%s\n' "$MAIL_PASSWORD"
            printf 'MAIL_FROM=%s\n' "$MAIL_FROM"
          } > .env.production
          chmod 600 .env.production

      - name: Pull infrastructure and backup helper images
        run: |
          docker compose --env-file .env.production pull db caddy
          docker compose --env-file .env.production --profile ops pull scan-export scan-list scan-restore

      - name: Build API and migration image
        run: docker compose --env-file .env.production --profile ops build --pull app migrate scan-volume-init

      # Capture full-severity JSON reports before the separate blocking policy check.
      - name: Prepare Trivy report directory
        run: mkdir -p "$RUNNER_TEMP/clarity-trivy-reports"

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clarity-checker-api:ci
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/clarity-trivy-reports/api.json
          exit-code: "0"

      - name: Scan PostgreSQL image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: postgres:17-alpine
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/clarity-trivy-reports/postgres.json
          exit-code: "0"

      - name: Scan Caddy image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy:2-alpine
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/clarity-trivy-reports/caddy.json
          exit-code: "0"

      - name: Scan private-volume helper image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: busybox:1.37.0
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/clarity-trivy-reports/busybox.json
          exit-code: "0"

      - name: Upload Trivy JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clarity-container-cve-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/clarity-trivy-reports/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Initialize PostgreSQL and apply migrations
        run: |
          docker compose --env-file .env.production up -d db
          docker compose --env-file .env.production --profile ops run --rm migrate

      - name: Start API and verify health and DB role
        run: |
          docker compose --env-file .env.production up -d --wait app
          docker compose --env-file .env.production exec -T app python -c "from urllib.request import urlopen; print(urlopen('http://127.0.0.1:8000/health/ready', timeout=5).status)"
          docker compose --env-file .env.production exec -T app python -c 'from sqlalchemy import text; from backend.app.core.config import get_settings; from backend.app.database.session import create_database_engine; engine=create_database_engine(get_settings().database_url); result=engine.connect().execute(text("SELECT rolsuper FROM pg_roles WHERE rolname = current_user")).scalar_one(); assert result is False; print("Application database role is not a superuser")'

      - name: Install age and create ephemeral backup identity
        run: |
          sudo apt-get update
          sudo apt-get install --yes age
          age-keygen -o "$RUNNER_TEMP/backup-identity.txt" >/dev/null
          echo "BACKUP_AGE_RECIPIENT=$(age-keygen -y "$RUNNER_TEMP/backup-identity.txt")" >> "$GITHUB_ENV"
          echo "AGE_IDENTITY_FILE=$RUNNER_TEMP/backup-identity.txt" >> "$GITHUB_ENV"

      - name: Exercise encrypted backup
        run: |
          BACKUP_DIR="$RUNNER_TEMP/clarity-backups" scripts/backup_production.sh | tee "$RUNNER_TEMP/backup.log"
          backup_set="$(sed -n 's/^Encrypted backup set created: //p' "$RUNNER_TEMP/backup.log")"
          test -n "$backup_set"
          echo "BACKUP_SET=$backup_set" >> "$GITHUB_ENV"

      - name: Exercise guarded restore
        run: CONFIRM_RESTORE=YES scripts/restore_production.sh "$BACKUP_SET"

      # Full JSON reports were uploaded above. Enforce the owner-approved policy:
      # block only fixable HIGH/CRITICAL findings; leave unfixed findings in reports.
      - name: Enforce API image fixable HIGH/CRITICAL threshold
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clarity-checker-api:ci
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Enforce PostgreSQL image fixable HIGH/CRITICAL threshold
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: postgres:17-alpine
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Enforce Caddy image fixable HIGH/CRITICAL threshold
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: caddy:2-alpine
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Enforce BusyBox helper image fixable HIGH/CRITICAL threshold
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: busybox:1.37.0
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      - name: Clean up ephemeral Compose stack
        if: always()
        run: |
          if [ -f .env.production ]; then
            docker compose --env-file .env.production down --volumes --remove-orphans
            rm -f .env.production
          fi

  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit

      - name: Audit development lock
        run: pip-audit -r backend/requirements-lock.txt

      - name: Audit runtime lock
        run: pip-audit -r backend/requirements-runtime-lock.txt

  postgres-integration:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clarity_test
          POSTGRES_USER: clarity_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clarity_test -d clarity_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://clarity_test:test_password@localhost:5432/clarity_test
      TEST_DATABASE_URL: postgresql+psycopg://clarity_test:test_password@localhost:5432/clarity_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install locked development dependencies
        run: python -m pip install -r backend/requirements-lock.txt

      - name: Check Python dependency consistency
        run: python -m pip check

      - name: Apply PostgreSQL migrations
        run: python -m alembic -c backend/alembic.ini upgrade head

      - name: Check PostgreSQL migration drift
        run: python -m alembic -c backend/alembic.ini check

      - name: Run backend suite against PostgreSQL
        run: python -m pytest -q backend/tests
